  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
  <script>
    $(document).ready(function () {
      // JSON 데이터 로드
      let employeeData = {};

      $.getJSON('data.json', function (data) {
        employeeData = data.employees.reduce((acc, emp) => {
          acc[emp.name] = emp;
          return acc;
        }, {});

        // 박스에 이벤트 추가
        $('.box').each(function () {
          const $box = $(this);
          const name = $box.find('span').text().trim();
          const employee = employeeData[name];

          // 여분, 공석, GPT 항목은 툴팁을 표시하지 않음
          if (employee && !['여분', '공석', 'GPT', '디자인서버', '디바이스테스트'].includes(name)) {
            // 툴팁 생성
            const $tooltip = $(`
              <div class="tooltip">
                <div class="tooltip-inner">
                  <div class="tooltip-header">
                    ${employee.image ? `<img src="${employee.image}" alt="${employee.name}">` : ''}
                    <div style="width: 100%;border-bottom: 1px solid #ccc;padding-bottom: 10px">
                      <h4>${employee.name}</h4>
                      <p class="mt-3">${employee.department} / ${employee.position}</p>
                      <div class="tooltip-header-content">
                        <p><i class="material-icons">smartphone</i> ${employee.mobile}</p>
                        <p><i class="material-icons">phone_in_talk</i> ${employee.phone}</p>    
                      </div>            
                      <p><i class="material-icons">mail</i> ${employee.email}</p>
                    </div>
                  </div>
                  <div class="tooltip-body">
                    <p><i class="material-icons">event_note</i> 오늘의 일정</p>
                    <div class="tooltip-body-content">
                      <p>${employee.schedule}</p>
                    </div>
                  </div>
                </div>
              </div>
            `);
            $('body').append($tooltip);

            // 마우스 이벤트 처리
            $box.on('mousemove', function (e) {
              $tooltip.css({
                left: e.pageX + 15,
                top: e.pageY + 15,
                opacity: 1
              });
            });

            $box.on('mouseleave', function () {
              $tooltip.css('opacity', 0);
            });
          }
        });
      });
    });
  </script>
